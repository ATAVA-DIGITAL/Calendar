<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAVA Multi-Lingual Calendar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Style */
        header {
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            color: white;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            text-align: center;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            color: #cbd5e1;
        }

        /* Calendar Container */
        .calendar-container {
            background: white;
            width: 100%;
            max-width: 900px;
            border-radius: 0 0 12px 12px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Navigation Controls */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .nav-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background-color: #2563eb;
        }

        #month-year-display {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a8a;
        }

        /* Weekdays Grid */
        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            background-color: #e2e8f0;
            padding: 10px 0;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .weekday {
            color: #475569;
            font-size: 14px;
        }

        .weekday.sunday {
            color: #ef4444;
        }

        /* Days Grid */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        /* Individual Day Cell */
        .day-cell {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            min-height: 90px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .day-cell:hover {
            background-color: #f0fdf4;
            border-color: #22c55e;
        }

        .day-cell.empty {
            background-color: transparent;
            border: none;
            cursor: default;
        }

        .day-cell.today {
            background-color: #eff6ff;
            border: 2px solid #3b82f6;
        }

        /* Date Numbers Row */
        .date-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .eng-date {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
        }

        .day-cell.sunday .eng-date {
            color: #ef4444;
        }

        .alt-dates {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 10px;
            font-weight: 600;
        }

        .mal-date {
            color: #b45309; /* Brownish for Malayalam */
        }

        .ara-date {
            color: #047857; /* Greenish for Arabic/Hijri */
        }

        /* Event Indicator Dot */
        .event-indicator {
            font-size: 11px;
            background-color: #d9f99d;
            color: #365314;
            padding: 2px 4px;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
            max-width: 100%;
            font-weight: 600;
        }

        /* Modal/Popup Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #1e3a8a;
            font-size: 18px;
        }

        .modal-content textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            resize: none;
            margin-bottom: 15px;
            outline: none;
        }

        .modal-content textarea:focus {
            border-color: #3b82f6;
        }

        .modal-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save { background-color: #22c55e; color: white; }
        .btn-close { background-color: #94a3b8; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>ATAVA Digital Calendar & Event Planner</h1>
        <p>English • മലയാളം • Hijri (العربية)</p>
    </header>

    <div class="calendar-container">
        <!-- Navigation -->
        <div class="calendar-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">◀ Previous</button>
            <div id="month-year-display"></div>
            <button class="nav-btn" onclick="changeMonth(1)">Next ▶</button>
        </div>

        <!-- Weekdays -->
        <div class="weekdays-grid">
            <div class="weekday sunday">Sun</div>
            <div class="weekday">Mon</div>
            <div class="weekday">Tue</div>
            <div class="weekday">Wed</div>
            <div class="weekday">Thu</div>
            <div class="weekday">Fri</div>
            <div class="weekday">Sat</div>
        </div>

        <!-- Days -->
        <div class="days-grid" id="calendar-days"></div>
    </div>

    <!-- Event Input Modal -->
    <div class="modal" id="event-modal">
        <div class="modal-content">
            <h3 id="modal-date-title">Add Special Event</h3>
            <textarea id="event-text" placeholder="വിശേഷങ്ങൾ അല്ലെങ്കിൽ ഓർമ്മപ്പെടുത്തലുകൾ ഇവിടെ എഴുതാം..."></textarea>
            <div class="modal-btn-group">
                <button class="modal-btn btn-close" onclick="closeModal()">Cancel</button>
                <button class="modal-btn btn-save" onclick="saveEvent()">Save Details</button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let selectedDateKey = '';

        // Simple mock data conversion mapping for Malayalam Months (Sample reference)
        const malayalamMonths = ["ചങ്ങം", "കന്നി", "തുലാം", "വൃശ്ചികം", "ധനു", "മകരം", "കുംഭം", "മീനം", "മേടം", "ഇടവം", "മിഥുനം", "കർക്കടകം"];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Display current Month and Year
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('month-year-display').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            const daysGrid = document.getElementById('calendar-days');
            daysGrid.innerHTML = '';

            // Empty slots for previous month alignment
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day-cell', 'empty');
                daysGrid.appendChild(emptyCell);
            }

            // Creating each day cell
            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell');
                
                // Check if Sunday
                const currentDayOfWeek = new Date(year, month, day).getDay();
                if (currentDayOfWeek === 0) {
                    dayCell.classList.add('sunday');
                }

                // Highlight Today
                const today = new Date();
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayCell.classList.add('today');
                }

                // Date key format for LocalStorage (e.g., "2026-07-18")
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

                // --- 1. Arabic (Hijri) Calculation using Intl API ---
                const loopDate = new Date(year, month, day);
                let hijriString = "1";
                try {
                    const formatter = new Intl.DateTimeFormat('en-TN-u-ca-islamic', { day: 'numeric' });
                    hijriString = formatter.format(loopDate);
                } catch(e) {
                    hijriString = day; 
                }

                // --- 2. Simple Malayalam Date Math approximation ---
                // (True Kollavarsham requires complex calculations, this provides a steady rolling offset)
                let malDay = (day + 15) % 30;
                if(malDay === 0) malDay = 30;

                // Structure inside the Cell
                dayCell.innerHTML = `
                    <div class="date-row">
                        <span class="eng-date">${day}</span>
                        <div class="alt-dates">
                            <span class="ara-date">${hijriString} 🌙</span>
                            <span class="mal-date">${malDay} 🌾</span>
                        </div>
                    </div>
                `;

                // Render saved custom events
                const savedEvent = localStorage.getItem(dateKey);
                if (savedEvent) {
                    const eventDiv = document.createElement('div');
                    eventDiv.classList.add('event-indicator');
                    eventDiv.innerText = savedEvent;
                    dayCell.appendChild(eventDiv);
                }

                // Click event to add custom note
                dayCell.onclick = () => openModal(dateKey, day, monthNames[month], year);

                daysGrid.appendChild(dayCell);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        // Modal Management
        function openModal(key, day, monthName, year) {
            selectedDateKey = key;
            document.getElementById('modal-date-title').innerText = `Add Note for ${day} ${monthName} ${year}`;
            document.getElementById('event-text').value = localStorage.getItem(key) || '';
            document.getElementById('event-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('event-modal').style.display = 'none';
        }

        function saveEvent() {
            const text = document.getElementById('event-text').value.trim();
            if (text) {
                localStorage.setItem(selectedDateKey, text);
            } else {
                localStorage.removeItem(selectedDateKey);
            }
            closeModal();
            renderCalendar();
        }

        // Run on load
        renderCalendar();
    </script>
</body>
</html>
